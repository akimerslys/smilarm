<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alarm+</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#777;--card:#f3f3f5;--acc:#e8590c;--ok:#2b8a3e;--bad:#d9480f}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--fg:#eee;--mut:#999;--card:#1e1e22}}
*{box-sizing:border-box}body{margin:0 auto;max-width:520px;padding:16px;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.t{font-size:32px;font-weight:600}.mut{color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;background:var(--acc);color:#fff}button.g{background:transparent;color:var(--mut);border:1px solid var(--mut)}button.on{background:var(--ok);color:#fff;border-color:var(--ok)}
input[type=time],input[type=text]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg)}
.days label{display:inline-block;margin:2px 6px 2px 0;font-size:14px}
#ring{display:none;border:2px solid var(--acc)}.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
img{width:100%;border-radius:8px;display:none;margin-top:8px}
#verdict{font-size:22px;font-weight:600;text-align:center;padding:10px;border-radius:8px;background:var(--bg);margin-top:8px}
#verdict.smile{color:var(--ok)}#verdict.no{color:var(--bad)}#verdict.none{color:var(--mut)}
table{width:100%;border-collapse:collapse;font:13px ui-monospace,monospace;margin-top:8px}td{padding:2px 4px;border-top:1px solid var(--bg)}td:last-child{text-align:right}
#err{color:var(--bad);font-size:14px}
details.card>summary{cursor:pointer;font-weight:600}
.set{display:grid;grid-template-columns:1fr 150px;gap:2px 10px;align-items:center;margin:8px 0 2px}.set small{grid-column:1/-1;color:var(--mut);margin-bottom:6px}
.set input[type=text],.set input[type=number],.set select{width:100%;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg)}
.set .lock{opacity:.5}.set .ovr{color:var(--acc)}h3{font-size:14px;margin:14px 0 0;color:var(--mut);text-transform:uppercase}
.meter{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}.meter i{display:block;height:100%;background:var(--ok);width:0}.meter i.hot{background:var(--bad)}
#setup b{display:block;margin-bottom:6px}#setup .it{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--bg);font-size:14px}
#setup .it button{padding:3px 10px;font-size:13px}.lv{font-weight:700;width:1.4em}.lv.ok{color:var(--ok)}.lv.warn,.lv.todo{color:var(--bad)}.lv.info{color:var(--mut)}
#rstbar{display:none;margin:8px 0;padding:8px;border-radius:8px;background:var(--bg);border:1px solid var(--acc);font-size:14px}
.badge{font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:0 4px;margin-left:4px}
pre{max-height:220px;overflow:auto;font:12px ui-monospace,monospace;background:var(--bg);padding:8px;border-radius:8px;white-space:pre-wrap}
</style></head><body>
<h1>⏰ Alarm+ <span class="mut" id="next"></span></h1>

<div class="card" id="setup" style="display:none"></div>

<div class="card" id="ring"><b>🔔 Ringing! Smile at the camera 😁</b>
 <div class="mut" id="score"></div><div class="bar"><i id="rbar"></i></div>
 <button class="g" id="dis" style="margin-top:8px">Stop alarm</button></div>

<div id="list"></div>

<div class="card"><div class="row" style="flex-wrap:nowrap"><input type="time" id="time" value="07:00"><input type="text" id="label" placeholder="Label" style="flex:1;min-width:0"></div>
 <div class="days" id="days" style="margin:8px 0"></div>
 <div class="row"><label><input type="checkbox" id="once"> once</label><button id="add">Add alarm</button></div></div>

<div class="row"><button class="g" id="test">Test ring</button><button class="g" id="cam">Camera</button><button class="g" id="st">Smile test</button><button class="g" id="tok">Token</button></div>
<div id="err"></div>
<img id="prev" alt="">
<div id="dbg" class="card" style="display:none">
 <div id="verdict" class="none">…</div>
 <div class="bar"><i id="tbar"></i></div>
 <table id="tbl"></table>
</div>

<details class="card" id="sysd"><summary>System &amp; debug</summary>
 <div class="row" style="margin-top:8px"><span>CPU <b id="cpu">–</b></span><span>Memory <b id="mem">–</b></span><span>Temp <b id="temp">–</b></span></div>
 <div class="meter" style="margin-top:6px"><i id="cpub"></i></div><div class="meter" style="margin-top:4px"><i id="memb"></i></div>
 <table id="sys"></table>
 <h3>Last hook runs</h3><pre id="hooks">–</pre>
 <h3>Log <select id="loglvl" style="font:inherit;font-size:12px"><option value="">everything</option><option value="warn">warnings &amp; errors only</option></select></h3><pre id="log">–</pre>
 <div class="row"><button class="g" id="sndtest">Test sound (6 s)</button><span class="mut">plays the current alarm sound without the camera</span></div>
</details>

<details class="card" id="setd"><summary>Settings</summary>
 <div class="mut" id="lockmsg" style="margin-top:6px"></div>
 <div id="rstbar"><span id="rsttxt"></span> <button id="rstbtn" style="margin-left:6px">Restart now</button></div>
 <div id="setform"></div>
 <div class="row" style="margin-top:10px"><button id="setsave">Save to config.toml</button><button class="g" id="setreload">Reload file</button><button class="g" id="setreset">Restore defaults</button></div>
 <div class="mut" id="setmsg"></div>
</details>

<script>
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),$=id=>document.getElementById(id),DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let token=localStorage.getItem('tok')||'',mode='',dbgTimer=null;
const q=u=>token?u+(u.includes('?')?'&':'?')+'token='+encodeURIComponent(token):u;
async function api(m,u,b){const r=await fetch(q(u),{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)});
 if(r.status==401){token=prompt('Token')||'';localStorage.setItem('tok',token);return api(m,u,b)}
 if(!r.ok){alert(await r.text());return false}return r.json()}
$('days').innerHTML=DN.map((d,i)=>`<label><input type=checkbox value=${i}> ${d}</label>`).join('');
function render(s){
 $('next').textContent=s.next?'→ '+s.next.at.replace('T',' '):'';
 const ring=s.state=='ringing';$('ring').style.display=ring?'block':'none';
 if(ring){$('score').textContent='smile: '+(s.score??'no face found');$('rbar').style.width=(s.progress*100)+'%';const d=$('dis');d.textContent=s.can_stop?'Stop alarm':'Stop alarm (disabled in Settings)';d.className=s.can_stop?'':'g'}
 if(s.alarms)$('list').innerHTML=s.alarms.map(a=>`<div class="card row"><div><div class="t">${a.time}</div><div class="mut">${esc(a.label||'')} ${a.days.length?a.days.map(d=>DN[d]).join(' '):'every day'}${a.once?' · once':''}</div></div>
  <div><input type=checkbox ${a.enabled?'checked':''} onchange="api('PUT','/api/alarms/${a.id}',{enabled:this.checked}).then(load)"> <button class=g onclick="api('DELETE','/api/alarms/${a.id}').then(load)">✕</button></div></div>`).join('')}
async function load(){const s=await api('GET','/api/state');s&&render(s)}
$('add').onclick=async()=>{await api('POST','/api/alarms',{time:$('time').value,label:$('label').value,once:$('once').checked,days:[...$('days').querySelectorAll('input:checked')].map(i=>+i.value)});load()};
$('test').onclick=()=>api('POST','/api/test');$('dis').onclick=()=>api('POST','/api/dismiss').then(load);
$('tok').onclick=()=>{token=prompt('Token',token)||'';localStorage.setItem('tok',token)};

// camera views: '' (off) | 'cam' (plain preview) | 'st' (smile test with live debug values)
function setMode(m){
 mode=mode==m?'':m;const p=$('prev');
 p.src='';clearInterval(dbgTimer);$('err').textContent='';
 $('cam').classList.toggle('on',mode=='cam');$('st').classList.toggle('on',mode=='st');
 p.style.display=mode?'block':'none';$('dbg').style.display=mode=='st'?'block':'none';
 if(!mode)return;
 p.onerror=()=>{if(mode){$('err').textContent=mode=='st'?'Smile test unavailable: an alarm is ringing, another test is running, or the camera is unreachable.':'Camera unavailable.';p.style.display='none'}};
 p.onload=()=>{$('err').textContent=''};
 p.src=q(mode=='st'?'/api/smile-test.mjpg':'/api/preview.mjpg');
 if(mode=='st'){pollDebug();dbgTimer=setInterval(pollDebug,300)}}
$('cam').onclick=()=>setMode('cam');$('st').onclick=()=>setMode('st');

const ROWS=[['smile score','score'],['threshold','threshold'],['hold progress','progress'],['would dismiss','would_dismiss'],['face found','face'],
 ['detector','backend'],['inference ms','infer_ms'],['detect fps','detect_fps'],['detect frame age ms','detect_frame_age_ms'],['frame size','frame_size'],
 ['camera state','cam_state'],['flashlight','cam_flash'],['flashlight error','cam_flash_error'],['camera error','cam_error'],['camera fps','cam_fps'],['camera frame age ms','cam_frame_age_ms'],['camera reconnects','cam_reconnects'],['camera frames','cam_frames'],
 ['quality preset','quality'],['rotate (deg)','rotate'],['detect width','detect_width'],['hold seconds','hold_seconds'],['camera','camera_source'],['alarm ringing','ringing']];
async function pollDebug(){
 const r=await fetch(q('/api/debug'));if(!r.ok)return;const d=await r.json(),v=$('verdict');
 if(d.cam_state=='error'){v.className='no';v.textContent='📷 camera error: '+d.cam_error}
 else if(d.no_frames){v.className='none';v.textContent='⏳ waiting for camera…'}
 else if(d.detector_stalled){v.className='none';v.textContent='⏳ detector not answering'}
 else if(!d.face){v.className='none';v.textContent='❓ no face'}
 else if(d.smiling){v.className='smile';v.textContent='😁 SMILING'}
 else{v.className='no';v.textContent='😐 not smiling'}
 $('tbar').style.width=((d.progress||0)*100)+'%';
 $('tbl').innerHTML=ROWS.map(([n,k])=>`<tr><td>${n}</td><td>${esc(d[k]===undefined||d[k]===null?'–':d[k])}</td></tr>`).join('')}

// ---- System & debug (polled only while the panel is open) ----
let sysTimer=null;
const fmtS=s=>s==null?'–':s>86400?Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h':s>3600?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':Math.floor(s/60)+'m '+s%60+'s';
const meter=(id,p)=>{const e=$(id);e.style.width=(p||0)+'%';e.className=p>85?'hot':''};
async function pollSys(){
 const r=await fetch(q('/api/system'));if(!r.ok)return;const d=await r.json();
 $('cpu').textContent=d.cpu_percent==null?'–':d.cpu_percent+'%';meter('cpub',d.cpu_percent);
 $('mem').textContent=d.mem?d.mem.used_mb+'/'+d.mem.total_mb+' MB':'–';meter('memb',d.mem&&d.mem.percent);
 $('temp').textContent=d.cpu_temp_c==null?'–':d.cpu_temp_c+'°C';
 const net=Object.entries(d.network||{}).map(([k,v])=>k+': '+(v.reachable?'ok '+v.ms+' ms':'UNREACHABLE')).join(', ');
 const rows=[['running in Docker',d.in_docker?'yes':'no'],['device time',d.device_time+' ('+d.timezone+')'],['host',d.hostname],['platform',d.platform],['python',d.python],['load 1/5/15',d.load&&d.load.join(' ')],['cpu cores',d.cpu_count],
  ['power / throttling',d.throttled==null?'n/a':d.throttled.length?d.throttled.join(', '):'ok'],['service RSS',d.process_rss_mb&&d.process_rss_mb+' MB'],
  ['disk free',d.disk&&d.disk.free_mb+' MB ('+d.disk.percent+'% used)'],['host uptime',fmtS(d.host_uptime_s)],['service uptime',fmtS(d.service_uptime_s)],
  ['reachability',net||'–'],['audio now',d.audio.current],['audio players',d.audio.players.join(', ')||'none'],
  ['last alarm',d.last_alarm?d.last_alarm.at+' · '+d.last_alarm.reason+' · '+d.last_alarm.seconds+'s':'–'],
  ...Object.entries(d.versions).map(([k,v])=>['pkg '+k,v])];
 $('sys').innerHTML=rows.map(([n,v])=>`<tr><td>${n}</td><td>${esc(v??'–')}</td></tr>`).join('');
 $('hooks').textContent=d.hooks.length?d.hooks.map(h=>h.at+' '+h.hook+' exit='+h.code+' '+h.cmd+(h.output?' → '+h.output.trim():'')).join(String.fromCharCode(10)):'no hook has run yet';
 const l=await (await fetch(q('/api/logs?n=150'))).json();const pre=$('log'),bottom=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-8;
 const lines=$('loglvl').value=='warn'?l.lines.filter(x=>/ (WARNING|ERROR|CRITICAL) /.test(x)):l.lines;
 pre.textContent=lines.join(String.fromCharCode(10))||'(no log lines yet)';if(bottom)pre.scrollTop=pre.scrollHeight}
$('sysd').ontoggle=()=>{clearInterval(sysTimer);if($('sysd').open){pollSys();sysTimer=setInterval(pollSys,2000)}};
$('sndtest').onclick=()=>api('POST','/api/sound-test');

// ---- First-run checklist ----
async function loadSetup(){
 const r=await fetch(q('/api/setup'));if(!r.ok)return;const d=await r.json();const el=$('setup');
 const sym={ok:'✓',warn:'!',todo:'!',info:'i'};
 const open=d.attention>0;
 el.style.display='block';
 el.innerHTML=`<details ${open?'open':''}><summary><b style="display:inline">${open?'Finish the setup ('+d.attention+')':'Setup ✓'}</b></summary>`+d.checks.map(c=>
  `<div class="it"><span><span class="lv ${c.level}">${sym[c.level]}</span> <b style="display:inline">${esc(c.title)}</b><br><span class="mut">${esc(c.detail)}</span></span>${c.key&&c.level!='ok'?`<button class="g" onclick="openSettings('${c.key}')">Open</button>`:''}</div>`).join('')+'</details>'}
function openSettings(key){$('setd').open=true;loadSettings(key)}

// ---- Settings (rendered from the server's schema, so ranges/choices always match validation) ----
let schema=[];
function field(s){
 const id='s_'+s.key.replace('.','_'),dis=s.locked?'disabled':'',v=s.value;let input;
 if(s.type=='bool')input=`<input type=checkbox id=${id} ${v?'checked':''} ${dis}>`;
 else if(s.type=='choice')input=`<select id=${id} ${dis}>${s.choices.map(c=>`<option ${c==v?'selected':''}>${c}</option>`).join('')}</select>`;
 else if(s.type=='str')input=`<input type=${s.secret?'password':'text'} ${s.key=='audio.device'?'list=audiodevs':''} id=${id} value="${esc(v)}" ${dis} ${s.secret?'autocomplete=new-password':''}>${s.secret?`<label style="font-size:12px"><input type=checkbox onchange="$('${id}').type=this.checked?'text':'password'"> show</label>`:''}`;
 else input=`<input type=number id=${id} value=${v} min=${s.min} max=${s.max} step=${s.step||1} ${dis}>`;
 const range=s.type=='int'||s.type=='float'?` (${s.min}–${s.max})`:'';
 return `<label class="${s.locked?'lock':''} ${s.overridden?'ovr':''}" for=${id}>${s.key}${s.overridden?' •':''}${s.restart?'<span class="badge">restart</span>':''}</label>${input}<small>${s.help}${range}${s.locked?' — needs server.token':''}</small>`}
const GN={general:'General',server:'Access & network',camera:'Camera',smile:'Smile detection',audio:'Sound',moode:'Second speaker (moOde)',ring:'Ringing',logging:'Logging',hooks:'After-alarm commands',events:'Webhook'};
function showRestart(on){$('rstbar').style.display=on?'block':'none';$('rsttxt').textContent='A change you made (marked "restart") applies after the service restarts.'}
async function loadSettings(focus){
 const r=await api('GET','/api/settings');if(!r)return;schema=r.settings;
 $('lockmsg').textContent=r.locked?'Commands and the webhook are read-only until you set an access token below (so nobody on your network can set a command).':'';
 showRestart(r.restart_needed);
 const groups={};schema.forEach(s=>(groups[s.key.split('.')[0]]??=[]).push(s));
 $('setform').innerHTML=Object.entries(groups).map(([g,l])=>`<h3>${GN[g]||g}</h3><div class="set">${l.map(field).join('')}</div>`).join('');
 fetch(q('/api/audio-devices')).then(x=>x.json()).then(d=>{let dl=$('audiodevs');if(!dl){dl=document.createElement('datalist');dl.id='audiodevs';document.body.appendChild(dl)}
  dl.innerHTML=d.devices.map(v=>`<option value="${esc(v.id)}">${esc(v.name)}</option>`).join('')}).catch(()=>{});
 if(focus){const e=$('s_'+focus.replace('.','_'));if(e){e.scrollIntoView({block:'center'});e.focus()}}}
$('rstbtn').onclick=async()=>{if(!confirm('Restart the service now? The page reconnects by itself.'))return;
 const r=await api('POST','/api/restart');if(!r)return;$('rsttxt').textContent='Restarting…';
 const port=window.__newPort||location.port;
 for(let i=0;i<60;i++){await new Promise(x=>setTimeout(x,1500));try{const f=await fetch(location.protocol+'//'+location.hostname+':'+port+'/api/setup'+(token?'?token='+encodeURIComponent(token):''),{mode:'no-cors'});if(f.type=='opaque'||f.status<500){location.href=location.protocol+'//'+location.hostname+':'+port+'/';return}}catch(e){}}
 $('rsttxt').textContent='The service did not come back within 90 s. Check the log (docker compose logs alarmplus).'};
$('setd').ontoggle=()=>{if($('setd').open)loadSettings()};
$('setsave').onclick=async()=>{
 const upd={};schema.filter(s=>!s.locked).forEach(s=>{const e=$('s_'+s.key.replace('.','_'));
  const v=s.type=='bool'?e.checked:s.type=='int'||s.type=='float'||(s.type=='choice'&&typeof s.choices[0]=='number')?(e.value===''?NaN:+e.value):e.value;if(v!==s.value)upd[s.key]=v});
 if(!Object.keys(upd).length){$('setmsg').textContent='Nothing changed.';return}
 const r=await fetch(q('/api/settings'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(upd)});
 if(r.ok){if('server.token' in upd){token=upd['server.token'];localStorage.setItem('tok',token)}
  if('server.port' in upd)window.__newPort=String(upd['server.port']);
  $('setmsg').textContent='Saved and applied. Camera/sound changes take effect on the next alarm or test.';loadSettings();loadSetup()}
 else{let t=await r.text();try{t=Object.entries(JSON.parse(t)).map(([k,m])=>k+': '+m).join('; ')}catch(e){}$('setmsg').textContent='Not saved — '+t}};
$('setreset').onclick=async()=>{if(confirm('Write the built-in default of every setting shown here into config.toml? (A copy is kept as config.toml.bak.)')){if(await api('DELETE','/api/settings')){$('setmsg').textContent='Defaults written to config.toml.';loadSettings()}}};
$('setreload').onclick=async()=>{const r=await api('POST','/api/settings/reload');if(!r)return;const p=Object.entries(r.problems||{});$('setmsg').textContent=p.length?'Reloaded; ignored invalid values: '+p.map(([k,m])=>k+': '+m).join('; '):'Reloaded config.toml.';loadSettings()};

loadSetup();
load().then(()=>{const es=new EventSource(q('/api/events'));
 es.onmessage=e=>{const s=JSON.parse(e.data);render(s);if(s.state=='idle'&&s.next!==undefined)load()}});
</script></body></html>
