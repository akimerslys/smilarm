<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alarm+</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#777;--card:#f3f3f5;--acc:#e8590c;--ok:#2b8a3e}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--fg:#eee;--mut:#999;--card:#1e1e22}}
*{box-sizing:border-box}body{margin:0 auto;max-width:520px;padding:16px;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.t{font-size:32px;font-weight:600}.mut{color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;background:var(--acc);color:#fff}button.g{background:transparent;color:var(--mut);border:1px solid var(--mut)}
input[type=time],input[type=text]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg)}
.days label{display:inline-block;margin:2px 6px 2px 0;font-size:14px}
#ring{display:none;border:2px solid var(--acc)}#bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;margin-top:8px}#bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
img{width:100%;border-radius:8px;display:none;margin-top:8px}
</style></head><body>
<h1>⏰ Alarm+ <span class="mut" id="next"></span></h1>

<div class="card" id="ring"><b>🔔 Звенит! Улыбнись в камеру 😁</b>
 <div class="mut" id="score"></div><div id="bar"><i></i></div>
 <button class="g" id="dis" style="display:none;margin-top:8px">Выключить (камера не отвечает)</button></div>

<div id="list"></div>

<div class="card"><div class="row"><input type="time" id="time" value="07:00"><input type="text" id="label" placeholder="Название" style="flex:1;min-width:0"></div>
 <div class="days" id="days" style="margin:8px 0"></div>
 <div class="row"><label><input type="checkbox" id="once"> один раз</label><button id="add">Добавить</button></div></div>

<div class="row"><button class="g" id="test">Тест звонка</button><button class="g" id="cam">Камера</button><button class="g" id="tok">Токен</button></div>
<img id="prev" alt="">

<script>
const $=id=>document.getElementById(id),DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
let token=localStorage.getItem('tok')||'';
const q=u=>token?u+(u.includes('?')?'&':'?')+'token='+encodeURIComponent(token):u;
async function api(m,u,b){const r=await fetch(q(u),{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)});
 if(r.status==401){token=prompt('Токен')||'';localStorage.setItem('tok',token);return api(m,u,b)}
 if(!r.ok)alert(await r.text());return r.ok&&r.json()}
$('days').innerHTML=DN.map((d,i)=>`<label><input type=checkbox value=${i}> ${d}</label>`).join('');
function render(s){
 $('next').textContent=s.next?'→ '+s.next.at.replace('T',' '):'';
 const ring=s.state=='ringing';$('ring').style.display=ring?'block':'none';
 if(ring){$('score').textContent='улыбка: '+(s.score??'лицо не найдено');$('bar').firstChild.style.width=(s.progress*100)+'%';$('dis').style.display=s.degraded?'inline-block':'none'}
 if(s.alarms)$('list').innerHTML=s.alarms.map(a=>`<div class="card row"><div><div class="t">${a.time}</div><div class="mut">${a.label||''} ${a.days.length?a.days.map(d=>DN[d]).join(' '):'каждый день'}${a.once?' · раз':''}</div></div>
  <div><input type=checkbox ${a.enabled?'checked':''} onchange="api('PUT','/api/alarms/${a.id}',{enabled:this.checked})"> <button class=g onclick="api('DELETE','/api/alarms/${a.id}').then(load)">✕</button></div></div>`).join('')}
async function load(){const s=await api('GET','/api/state');s&&render(s)}
$('add').onclick=async()=>{await api('POST','/api/alarms',{time:$('time').value,label:$('label').value,once:$('once').checked,days:[...$('days').querySelectorAll('input:checked')].map(i=>+i.value)});load()};
$('test').onclick=()=>api('POST','/api/test');$('dis').onclick=()=>api('POST','/api/dismiss');
$('tok').onclick=()=>{token=prompt('Токен',token)||'';localStorage.setItem('tok',token)};
$('cam').onclick=()=>{const p=$('prev');p.style.display=p.style.display=='block'?'none':'block';p.src=p.style.display=='block'?q('/api/preview.mjpg'):''};
let lastAlarms;load().then(()=>{const es=new EventSource(q('/api/events'));
 es.onmessage=e=>{const s=JSON.parse(e.data);render(s);if(s.state=='idle'&&s.next!==undefined)load()}});
</script></body></html>
