# Alarm+ configuration (generated with all default values; edit what you need).
# Most of these can also be changed live in the web UI > Settings, which saves them back into this file.

# alarms, the face model, logs and the built-in tone live here (relative to this file)
data_dir = "data"

[general]
# Your timezone, e.g. Europe/London or America/New_York. Alarm times use it. Empty = the device's own timezone (a container is usually UTC!).
timezone = ""

[server]
# Interface the web UI listens on (0.0.0.0 = the whole network). Needs a restart.
host = "0.0.0.0"
# Web UI / API port. Needs a restart (in Docker with the default host networking this is the port directly).
port = 8080
# Access token. Empty = open to the whole network. Once set, the UI asks for it and every API call needs it (Bearer token or ?token=). Required to edit commands and the webhook. Printable characters, no spaces, max 128.
token = ""
# Address other devices (the moOde speaker) use to reach this app, e.g. http://192.168.1.20:8080. Empty = detected automatically (wrong inside Docker bridge networking).
public_url = ""

[camera]
# ESP32 stream URL (http://IP:81/stream) or a local camera index like 0.
source = "http://alarmcam.local:81/stream"
# ESP32 resolution preset: low 320x240, medium 640x480, high 800x600.
quality = "low"
# Rotate the picture clockwise so faces are upright (sideways camera: try 90, else 270).
rotate = 0
# Switch the ESP32 flash LED on while the camera is in use (alarm ringing, Camera view, Smile test). Needs the current firmware.
flashlight = false
# Flash LED brightness, percent. It is very bright and gets warm: stay low for long alarms.
flashlight_level = 30
# Width frames are scaled to for detection; 0 = take it from the quality preset.
width = 0

[smile]
# Smile detector: auto (MediaPipe, falling back to OpenCV Haar), mediapipe, or haar (less accurate, no model file).
backend = "auto"
# Smile score needed to count as smiling (lower = easier).
threshold = 0.5
# How long the smile must be held.
hold_seconds = 2.5
# Detections per second while ringing.
fps = 6
# MediaPipe face-landmarker model file. Normally leave as is.
model = "data/face_landmarker.task"

[audio]
# Where the alarm sound plays.
backend = "local"
# Sound file path or http(s) URL. Empty = built-in tone.
sound = ""
# Folder of sounds; one is picked at random per alarm. Overrides 'sound'.
sound_dir = ""
# mpv/aplay output device, e.g. alsa/plughw:1,0 (see docs/sound_output.md). Empty = default.
device = ""
# Starting volume, %.
volume_start = 15
# Final volume, %.
volume_max = 100
# Seconds to ramp from start to max volume.
ramp_seconds = 45

[moode]
# Hostname or IP of the moOde device.
host = "moode.local"
# MPD port.
port = 6600
# URL moOde plays. Empty = this app serves the sound itself.
url = ""
# Play on this device if moOde is unreachable.
fallback_local = true
# Folder in moOde's music library (e.g. ALARM_TRACKS): a random file from it is played, nothing is sent from this device.
library_dir = ""

[ring]
# Failsafe: stop ringing after this many minutes.
max_minutes = 15
# Allow dismissing without a smile (defeats the purpose).
allow_manual_dismiss = false
# Camera silent this long = manual dismiss unlocked.
camera_fail_seconds = 45

[logging]
# Log detail for the web UI log and `docker compose logs` / journalctl: DEBUG adds per-second detection and camera numbers.
level = "INFO"

[events]
# POST ringing/dismissed events here (e.g. OpenClaw).
webhook_url = ""

[hooks]
# Shell command run on this device when an alarm starts.
on_ring = ""
# Shell command run on this device when an alarm ends.
on_dismiss = ""
# Kill a hook that runs longer than this.
timeout_seconds = 120
