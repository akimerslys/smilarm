# Smilarm: the deployment description. `bash install.sh` copies it to ~/.smilarm/compose/ and starts it; you never need to edit it.
# Optional pieces are separate files that the installer lists in ~/.smilarm/compose/.env (COMPOSE_FILE=...):
#   docker-compose.sound.yml  this device's speakers (/dev/snd); added automatically when the device has sound hardware
#   docker-compose.local.yml  YOUR additions (USB camera, PulseAudio socket, bridge networking); create it next to this file, updates keep it
name: smilarm

services:
  smilarm:
    # SMILARM_IMAGE is set by the installer: the prebuilt image from the registry, or smilarm:local when it was built from a clone.
    image: ${SMILARM_IMAGE:-smilarm:local}
    container_name: smilarm
    restart: unless-stopped

    # Host networking (Linux/Raspberry Pi): the ESP32 camera and the moOde speaker reach the app on the device's real address,
    # with no port mapping. Without it see docs/install.md ("Bridge networking").
    network_mode: host

    environment:
      # Only used on the very first start, when the config is created: the installer sets it if port 8080 is taken.
      - SMILARM_PORT=${SMILARM_PORT:-}

    volumes:
      - smilarm-state:/state   # config.toml, alarms, logs and the face model live here and survive updates

volumes:
  smilarm-state:
    name: smilarm-state
