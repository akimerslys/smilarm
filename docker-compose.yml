# Alarm+ — the deployment description. Start it with:  bash install.sh   (or: docker compose up -d --build)
# Then open http://<this-device>:8080 and finish the setup in Settings. Nothing in this file needs editing.
#
# Optional pieces live in extra files that install.sh adds through a generated `.env` (COMPOSE_FILE=...):
#   docker-compose.sound.yml  this device's speakers (/dev/snd); added automatically when the device has sound hardware
#   docker-compose.local.yml  YOUR additions (USB camera, PulseAudio socket, bridge networking); never touched by updates; see docs/docker.md
# If you run `docker compose` by hand without install.sh, add the sound file yourself:  -f docker-compose.yml -f docker-compose.sound.yml
name: alarmplus

services:
  alarmplus:
    build: .
    image: alarmplus:latest
    container_name: alarmplus
    restart: unless-stopped

    # Host networking (Linux/Raspberry Pi): the ESP32 camera and the moOde speaker reach the app on the
    # device's real address, with no port mapping. If you can't use it, see docs/docker.md ("Bridge networking").
    network_mode: host

    environment:
      # Only used on the very first start, when the config is created: install.sh sets it if port 8080 is taken.
      - ALARMPLUS_PORT=${ALARMPLUS_PORT:-}

    volumes:
      - alarmplus-state:/state   # config.toml, alarms, logs and the face model live here and survive updates

volumes:
  alarmplus-state:
    name: alarmplus-state
